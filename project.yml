name: Sanya
options:
  bundleIdPrefix: com.nezich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Sanya:
    type: application
    platform: iOS
    sources:
      - Sanya
      - Shared
    info:
      path: Sanya/Info.plist
      properties:
        CFBundleName: Sanya
        CFBundleDisplayName: Sanya
        CFBundleDevelopmentRegion: ru
        UIAppFonts: [CormorantGaramond-Medium.ttf, CormorantGaramond-SemiBold.ttf, Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf]
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Саня слушает твой голос, когда ты нажимаешь на микрофон.
        NSSpeechRecognitionUsageDescription: Чтобы превращать твой голос в текст для Сани.
        NSPhotoLibraryUsageDescription: Чтобы читать скрины графика смен.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.nezich.sanya
            CFBundleURLSchemes: [sanya]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nezich.sanya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SanyaWidgets
  SanyaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SanyaWidgets
      - Shared
    info:
      path: SanyaWidgets/Info.plist
      properties:
        CFBundleName: Sanya Widgets
        CFBundleDisplayName: Sanya Widgets
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        UIAppFonts: [CormorantGaramond-Medium.ttf, CormorantGaramond-SemiBold.ttf, Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nezich.sanya.widgets
  SanyaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SanyaUITests
    dependencies:
      - target: Sanya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nezich.sanya.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sanya
schemes:
  Sanya:
    build:
      targets:
        Sanya: all
        SanyaUITests: [test]
    test:
      targets: [SanyaUITests]
