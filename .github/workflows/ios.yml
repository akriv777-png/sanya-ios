name: iOS build, screenshots, videos
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Boot simulator
        run: |
          UDID=$(python3 scripts/pick_sim.py)
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl ui "$UDID" appearance dark || true
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Sanya.xcodeproj -scheme Sanya \
            -destination "id=$UDID" -derivedDataPath build | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          grep -q "TEST BUILD SUCCEEDED" build.log || { grep -B2 -A6 "error:" build.log | head -200; exit 1; }
      - name: UI tours (screenshots only)
        run: |
          mkdir -p out/videos out/shots
          mkdir -p out/simshots
          for T in testTour4Reality testTour1; do
            # simctl screenshots in parallel: independent of XCTest idle detection
            ( i=0; while [ $i -lt 60 ]; do sleep 8; i=$((i+1)); xcrun simctl io "$UDID" screenshot --type=png "out/simshots/${T}_$(printf %02d $i).png" >/dev/null 2>&1 || true; done ) &
            SNAP=$!
            # watchdog: never let one tour hang the job
            TEST_RUNNER_SHOT_DIR="$PWD/out/shots" perl -e 'alarm shift; exec @ARGV' 600 xcodebuild test-without-building -project Sanya.xcodeproj -scheme Sanya \
              -destination "id=$UDID" -derivedDataPath build \
              -only-testing:SanyaUITests/SanyaUITests/$T -resultBundlePath "out/$T.xcresult" > "out/$T.log" 2>&1 \
              || { echo "FAILED $T" >> out/failures.txt; grep -E "error|fail" "out/$T.log" | head -40; }
            kill $SNAP 2>/dev/null || true
            tail -60 "out/$T.log"
          done
          ls -la out/simshots
          ls -la out/videos out/shots
          mkdir -p out/crashes && cp ~/Library/Logs/DiagnosticReports/Sanya* out/crashes/ 2>/dev/null || true
          ls out/crashes
          cat out/failures.txt 2>/dev/null || echo "all tours passed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sanya-media
          path: |
            out/videos
            out/shots
            out/simshots
            out/failures.txt
            out/crashes
            out/*.log
            build.log
  ipa:
    runs-on: ${{ vars.MAC_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild build -project Sanya.xcodeproj -scheme Sanya -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee ipa.log | grep -E "error:|BUILD" || true
          APP=build-ios/Build/Products/Release-iphoneos/Sanya.app
          grep -q "BUILD SUCCEEDED" ipa.log || { grep -A6 "error:" ipa.log | head -100; exit 1; }
          V=$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)
          B=$(awk -F'"' '/CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml)
          mkdir -p Payload out && cp -R "$APP" Payload/
          zip -qry "out/Sanya-v${V}-${B}-unsigned.ipa" Payload
          ls -la out
          # IPA is published to akriv777-png/sanya-releases after a green build
          # via scripts/publish_release.sh (GITHUB_TOKEN cannot write to that repo).
      - uses: actions/upload-artifact@v4
        with:
          name: sanya-ipa
          path: out/Sanya-v*-unsigned.ipa
